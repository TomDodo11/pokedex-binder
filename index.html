<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pokédex Binder</title>
<meta name="description" content="Collect one card for every Pokémon. Catch random teams of six, fill your binder page by page, print placeholders and unlock 151 achievements.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f4f4f4' stroke='%231b1b1b' stroke-width='2.5'/%3E%3Cpath d='M2 16a14 14 0 0 1 28 0z' fill='%23e3350d' stroke='%231b1b1b' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23f4f4f4' stroke='%231b1b1b' stroke-width='2.5'/%3E%3C/svg%3E">
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
/* Layout: a collector's binder. Current team of six to catch up top, the dex below as 63×88 card pockets on binder pages. */
:root{
  --bg:#eaeef8; --surface:#ffffff; --pocket:#dde3f1; --sleeve:#c7d0e6;
  --ink:#14214a; --muted:#5a6688; --line:#c3cce3;
  --blue:#1d4fc4; --blue-soft:#d7e1fb; --yellow:#ffcb05; --on-yellow:#1a1500;
  --red:#e3350d; --ok:#178a4a; --warn:#b45309;
  --shadow:0 1px 0 rgba(20,33,74,.06),0 6px 18px -10px rgba(20,33,74,.35);
  --display:"Press Start 2P",ui-monospace,"Courier New",monospace;
  --body:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1229; --surface:#141d3b; --pocket:#1a2549; --sleeve:#28376a;
  --ink:#e7ecfb; --muted:#94a1c6; --line:#2a3866;
  --blue:#7a9cff; --blue-soft:#1d2b5c; --yellow:#ffcb05; --on-yellow:#1a1500;
  --red:#ff5b37; --ok:#3fcf80; --warn:#fbbf24;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1229; --surface:#141d3b; --pocket:#1a2549; --sleeve:#28376a;
  --ink:#e7ecfb; --muted:#94a1c6; --line:#2a3866;
  --blue:#7a9cff; --blue-soft:#1d2b5c; --yellow:#ffcb05; --on-yellow:#1a1500;
  --red:#ff5b37; --ok:#3fcf80; --warn:#fbbf24;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:22px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.px{font-family:var(--display);letter-spacing:.02em;line-height:1.5}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Header */
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{margin:0;font:400 clamp(15px,2.6vw,22px)/1.3 var(--display);color:var(--blue);text-wrap:balance}
.brand h1 b{display:block;font-weight:400;color:var(--ink);font-size:.55em;margin-top:6px;letter-spacing:.08em}
.tally{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:120px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.stat .v{font:400 17px/1.4 var(--display);margin-top:4px}
.stat .v small{font-size:10px;color:var(--muted)}

/* Ball icon */
.ball{--s:40px;width:var(--s);height:var(--s);border-radius:50%;position:relative;flex:none;
  background:linear-gradient(var(--red) 0 46%,#1b1b1b 46% 54%,#f4f4f4 54%);border:calc(var(--s)*.06) solid #1b1b1b;box-shadow:inset -4px -4px 0 rgba(0,0,0,.12)}
.ball::after{content:"";position:absolute;inset:50% auto auto 50%;width:34%;height:34%;transform:translate(-50%,-50%);border-radius:50%;background:#f4f4f4;border:calc(var(--s)*.06) solid #1b1b1b}

/* Gen progress */
.gens{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.gen{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left;display:grid;gap:6px}
.gen:hover{border-color:var(--blue)}
.gen[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.gen .t{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.gen .t span:first-child{font:400 10px/1 var(--display);color:var(--blue)}
.gen .t span:last-child{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--pocket);overflow:hidden}
.bar i{display:block;height:100%;background:var(--yellow);border-right:1px solid rgba(0,0,0,.15)}

/* Tabs */
nav.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);flex-wrap:wrap}
nav.tabs button{background:none;border:0;padding:10px 14px 12px;font:400 11px/1 var(--display);color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--yellow)}

/* Buttons */
.btn{border:2px solid var(--ink);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700;letter-spacing:.02em;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.go{background:var(--yellow);color:var(--on-yellow);border-color:#1a1500;box-shadow:0 4px 0 #1a1500;font:400 13px/1 var(--display);padding:16px 22px}
.btn.go:active{box-shadow:0 0 0 #1a1500}
.btn.ghost{box-shadow:none;border-width:1px;border-color:var(--line);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Team */
.teamhead{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
.teamhead h2{margin:0;font:400 18px/1.4 var(--display)}
.teamhead p{margin:4px 0 0;color:var(--muted)}
.team{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media (max-width:900px){.team{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.team{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}

/* Card pocket — 63×88mm, the real size of a trading card */
.pocket{aspect-ratio:63/88;border-radius:10px;position:relative;background:var(--pocket);
  box-shadow:inset 0 0 0 1px var(--sleeve),inset 0 10px 14px -12px rgba(255,255,255,.6);border:0;padding:0;width:100%;text-align:center;overflow:hidden}
.pocket .in{position:absolute;inset:6%;display:grid;grid-template-rows:auto 1fr auto;align-items:center;justify-items:center;gap:2px}
.pocket .dex{font:400 9px/1 var(--display);color:var(--muted);justify-self:start}
.pocket .nm{font-weight:600;font-size:12.5px;line-height:1.15;overflow-wrap:anywhere;color:var(--muted)}
.pocket .spr{width:92%}
.pocket.miss .spr{filter:brightness(0) opacity(.18)}
:root[data-theme="dark"] .pocket.miss .spr{filter:brightness(0) invert(1) opacity(.13)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pocket.miss .spr{filter:brightness(0) invert(1) opacity(.13)}}
.pocket.miss:hover .spr{filter:none;opacity:.55}
.pocket:hover{box-shadow:inset 0 0 0 2px var(--blue)}
/* a caught card sits in the sleeve: yellow border, like the real thing */
.pocket.got{background:var(--yellow)}
.pocket.got .in{inset:5%;background:linear-gradient(160deg,var(--surface),var(--blue-soft));border-radius:6px;padding:6% 4% 8%}
.pocket.got .nm{color:var(--ink)}
.pocket .tag{position:absolute;right:4px;bottom:4px;background:var(--ink);color:var(--surface);font:600 10.5px/1 var(--body);padding:3px 5px;border-radius:5px}
.pocket.dim{opacity:.28}
.pocket.hit{box-shadow:inset 0 0 0 3px var(--red)}

.slot{display:grid;gap:8px}
.slot .pocket .in{inset:7%}
.slot .pocket .nm{font-size:15px;color:var(--ink)}
.slot .pocket .dex{font-size:10px}
.slot.need .pocket{background:var(--surface);box-shadow:inset 0 0 0 2px var(--line),var(--shadow)}
.types{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.ty{font:700 10px/1 var(--body);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px;border-radius:4px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.state{display:flex;justify-content:center;align-items:center;gap:6px;font-size:13px;font-weight:700}
.state.need{color:var(--red)}
.state.got{color:var(--ok)}

/* Team goal */
.goal{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.goal .k{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.goal .v{font:400 14px/1.5 var(--display)}
.goal .v small{font:500 12px var(--body);color:var(--muted)}
.meter{display:flex;gap:6px;margin-right:auto}
.meter .ball{--s:26px}
.meter .ball.off{filter:grayscale(1);opacity:.3}
.stamp{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);font:400 10px/1 var(--display);color:var(--red);border:2px solid var(--red);border-radius:4px;padding:5px 6px 4px;background:var(--surface);opacity:.92;pointer-events:none}
.slot .pocket:hover .stamp{opacity:0}
/* Poké Ball reveal */
.reveal{aspect-ratio:63/88;display:grid;place-items:center;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line)}
.reveal .ball{--s:58%;width:58%;height:auto;aspect-ratio:1}
.shake{animation:shake .5s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.shake,.pop{animation:none}}

.empty{background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:28px 20px;display:grid;justify-items:center;gap:14px;text-align:center}
.empty .balls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.empty .ball{--s:34px;opacity:.85}
.empty p{margin:0;max-width:44ch;color:var(--muted)}

.rulebox{display:grid;gap:10px}
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.rhead h3{margin:0;font:400 11px/1.4 var(--display)}
.rulebox.editing{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.rgroups{display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font:400 9.5px/1.3 var(--display);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chipwrap{display:inline-flex;align-items:center}
.chipx{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}
.chipx:hover{color:var(--red)}
.clabel{font:400 9px/2.6 var(--display);color:var(--muted);margin-right:4px}
.ruleform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px dashed var(--line);padding-top:12px}
.ruleform b{flex-basis:100%;font:400 10px/1.4 var(--display);font-weight:400;color:var(--blue)}
.ruleform input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;flex:1 1 180px}
.ruleform input[name=t]{text-transform:uppercase}
.printbox{background:var(--surface);border:2px solid var(--blue);border-radius:14px;padding:14px;display:grid;gap:10px}
.printbox p{margin:0}
.printbox select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.ractions{display:flex;gap:8px;flex-wrap:wrap}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.rules li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.rules b{display:block;font:400 10px/1.4 var(--display);color:var(--blue);margin-bottom:4px}

/* Binder */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools input[type=search]{flex:1 1 220px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--pagew,330px)),1fr));gap:18px}
.page{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);display:grid;gap:10px;position:relative}
.page::before{content:"";position:absolute;left:-1px;top:18px;bottom:18px;width:6px;background:radial-gradient(circle,var(--bg) 2.5px,transparent 3px) 0 0/6px 28px repeat-y}
.page header{align-items:baseline;gap:8px}
.page h3{margin:0;font:400 10px/1.4 var(--display);color:var(--blue)}
.page header span{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:7px}
.grid.c4 .pocket .nm{font-size:11px}
.grid.c5 .pocket .nm,.grid.c6 .pocket .nm,.grid.c7 .pocket .nm,.grid.c8 .pocket .nm{display:none}
.grid.c6 .pocket .dex,.grid.c7 .pocket .dex,.grid.c8 .pocket .dex{font-size:7px}
.sizer{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sizer label{display:flex;align-items:center;gap:6px;font-weight:600}
.sizer input{width:64px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.flat{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.addgen{background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.addgen h3{margin:0;font:400 11px/1.4 var(--display)}
.addgen form{display:flex;flex-wrap:wrap;gap:8px}
.addgen input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
.addgen input[name=dex]{width:110px}
.addgen input[name=name]{flex:1 1 180px}

.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--blue-soft);border-radius:10px;padding:10px 12px}
.confirm span{flex:1 1 260px}

/* Achievements */
.achhead{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.achhead h2{margin:0;font-size:18px;font-weight:400}
.achhead p{margin:4px 0 0}
.bar.big{height:12px;border-radius:6px;flex:1 1 240px;max-width:420px}
.achcat{display:grid;gap:10px}
.achcat h3{margin:0;font:400 11px/1.4 var(--display);color:var(--blue)}
.achcat h3 span{font:600 13px var(--body);margin-left:6px}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.ach{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ach .ab{display:grid;gap:2px;min-width:0;font-size:13px}
.ach .ab b{font-size:15px}
.ach .when{color:var(--ok);font-weight:700;font-size:12px}
.ach .prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.ach .prog .bar{flex:1}
.medal{width:56px;height:56px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--pocket);box-shadow:inset 0 0 0 3px var(--sleeve);overflow:hidden}
.medal .spr{width:64px;max-width:none}
.ach:not(.on) .medal{filter:grayscale(1);opacity:.45}
.ach.on{border-color:var(--yellow);box-shadow:inset 0 0 0 1px var(--yellow)}
.ach.on .medal{background:var(--blue-soft);box-shadow:inset 0 0 0 3px var(--yellow),0 0 0 2px var(--yellow)}
.num-medal span,.ty-medal span{font:400 11px/1 var(--display);color:var(--ink)}
.ty-medal{background:var(--tc)!important}
.ty-medal span{color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.ty-medal.rainbow{background:conic-gradient(#e62829,#d4a300,#3a9a24,#26b5d8,#2980ef,#9141cb,#d757d7,#e62829)!important}
.unlock{position:fixed;inset:auto;margin:0;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:var(--yellow);color:var(--on-yellow);border:3px solid #1a1500;border-radius:14px;padding:10px 18px 10px 12px;box-shadow:0 6px 0 #1a1500;z-index:10;max-width:calc(100vw - 32px)}
.unlock.pop{animation:unl .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes unl{from{transform:translate(-50%,-24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.unlock:not(:popover-open){display:none}
.unlock .ball{--s:34px}
.unlock small{display:block;font:400 8px/1.4 var(--display)}
.unlock b{display:block;font-size:17px}
.unlock span:last-child:not(.ball){font-size:12px}

/* Sprite atlas: 32 columns × 33 rows of 96px cells */
.spr{aspect-ratio:1;background:url(sprites.png) 0 0/3200% auto no-repeat}
.spr.pix{image-rendering:pixelated}
.spr.shiny{background-image:url(shiny.png)}
.sparkle{position:absolute;left:5px;bottom:3px;color:#e0a800;font-size:15px;line-height:1;text-shadow:0 0 3px #fff8c4}
.shinybtn[aria-pressed="true"]{background:#fff3b0;border-color:#e0a800;color:#5a4300}
.catchrow{display:flex;gap:8px;flex-wrap:wrap}
.spr.none{display:grid;place-items:center;font:400 22px/1 var(--display);color:var(--muted);background:none}

/* Detail */
dialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--ink);width:min(440px,calc(100vw - 32px));box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(8,14,36,.55)}
.det{display:grid;gap:14px;padding:20px}
.det .top{display:flex;justify-content:space-between;align-items:start;gap:10px}
.det h2{margin:0;font:400 16px/1.4 var(--display)}
.det .art{background:var(--pocket);border-radius:14px;display:grid;place-items:center;padding:8px}
.det .art.got{background:var(--yellow)}
.det .art .spr{width:min(240px,70%)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.facts div{background:var(--bg);border-radius:8px;padding:8px 10px}
.facts dt{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.facts dd{margin:2px 0 0;font-weight:700}
.price{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.price label{font-weight:600}
.price .pf{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding-left:10px}
.price input{width:90px;border:0;background:none;padding:9px 10px 9px 4px}
.note{font-size:13px;color:var(--muted);margin:0}
.note.warn{color:var(--warn);font-weight:600}
.x{background:none;border:0;font-size:24px;line-height:1;color:var(--muted);padding:4px 8px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.foot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:flex-end;border-top:1px solid var(--line);padding-top:14px;font-size:14px;color:var(--muted)}
.foot select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink)}
.foot .backup{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-right:auto}
.foot .backup .link{font-size:14px;cursor:pointer}
.fan{font-size:12px;color:var(--muted);text-align:center;margin:0}
.banner{background:var(--blue-soft);border-radius:10px;padding:10px 14px;font-size:14px}
</style>

<div class="wrap">
  <header>
    <div class="brand"><div class="ball" aria-hidden="true"></div><h1>POKÉDEX BINDER<b>ONE CARD FOR EVERY POKÉMON</b></h1></div>

/* ---------- printable placeholders: 63×88mm cards, 9 to an A4 sheet ---------- */
const PDF_SAFE=s=>String(s).replace(/♀/g,' (F)').replace(/♂/g,' (M)').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/ł/g,'l').replace(/￥/g,'¥').replace(/[^\x20-\xFF\u20AC]/g,'');
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
async function buildPlaceholderPdf(jsPDF,cards,ruleTitles,getSprite,onProgress){
  const W=63,H=88,COLS=3,ROWS=3,X0=(210-W*COLS)/2,Y0=(297-H*ROWS)/2;
  const doc=new jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
  const BLUE=[29,79,196],INK=[20,33,74],GREY=[120,128,150],LINE=[200,205,218],YEL=[255,203,5];
  const rulesLine=ruleTitles.map(PDF_SAFE).join('  •  ');
  const perPage=COLS*ROWS, pages=Math.ceil(cards.length/perPage);
  for(let i=0;i<cards.length;i++){
    if(i&&i%perPage===0) doc.addPage();
    const k=i%perPage, x=X0+(k%COLS)*W, y=Y0+Math.floor(k/COLS)*H, c=cards[i];
    // cut line + card frame
    doc.setDrawColor(...LINE); doc.setLineWidth(0.2); doc.rect(x,y,W,H);
    doc.setDrawColor(...YEL); doc.setLineWidth(1.4); doc.roundedRect(x+3,y+3,W-6,H-6,2.5,2.5);
    // header
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...BLUE);
    doc.text(c.dex,x+6.5,y+9.5);
    doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(...GREY);
    doc.text(c.gen,x+W-6.5,y+9.5,{align:'right'});
    // sprite
    const img=getSprite(c);
    if(img) doc.addImage(img,'PNG',x+(W-38)/2,y+11,38,38,'s'+c.d,'FAST');
    else{doc.setFont('helvetica','bold');doc.setFontSize(60);doc.setTextColor(...LINE);doc.text('?',x+W/2,y+40,{align:'center'})}
    // name, shrunk to fit
    doc.setFont('helvetica','bold'); doc.setTextColor(...INK);
    let fs=14; const name=PDF_SAFE(c.name);
    doc.setFontSize(fs); while(fs>7&&doc.getTextWidth(name)>W-12){fs-=.5;doc.setFontSize(fs)}
    doc.text(name,x+W/2,y+55,{align:'center'});
    // type pills
    if(c.types.length){
      doc.setFont('helvetica','bold'); doc.setFontSize(6);
      const pw=c.types.map(t=>doc.getTextWidth(t.name.toUpperCase())+4), gap=1.5;
      let px=x+(W-(pw.reduce((a,b)=>a+b,0)+gap*(pw.length-1)))/2;
      c.types.forEach((t,j)=>{doc.setFillColor(...hexRgb(t.color));doc.roundedRect(px,y+58,pw[j],3.8,1,1,'F');
        doc.setTextColor(255,255,255);doc.text(t.name.toUpperCase(),px+pw[j]/2,y+60.65,{align:'center'});px+=pw[j]+gap});
    }
    // rules
    doc.setDrawColor(...LINE); doc.setLineWidth(0.25); doc.line(x+7,y+64.5,x+W-7,y+64.5);
    doc.setFont('helvetica','bold'); doc.setFontSize(5.5); doc.setTextColor(...BLUE);
    doc.text('MY RULES',x+W/2,y+67.6,{align:'center'});
    if(rulesLine){
      doc.setFont('helvetica','normal'); doc.setTextColor(...INK);
      let rs=7,lines; do{doc.setFontSize(rs);lines=doc.splitTextToSize(rulesLine,W-13).map(l=>l.replace(/^\s*•\s*|\s*•\s*$/g,''));rs-=.25}while(lines.length*rs*.3528*1.2>9.5&&rs>4);
      doc.text(lines,x+W/2,y+70.6,{align:'center',lineHeightFactor:1.2});
    }
    // footer
    doc.setFont('helvetica','normal'); doc.setFontSize(5.5); doc.setTextColor(...GREY);
    doc.text(c.where,x+6.5,y+H-5.6);
    doc.text('POKEDEX BINDER',x+W-6.5,y+H-5.6,{align:'right'});
    if(k===perPage-1||i===cards.length-1){onProgress&&onProgress(Math.floor(i/perPage)+1,pages);await new Promise(r=>setTimeout(r,0))}
  }
  return doc;
}

let jsPdfP=null;
function loadJsPdf(){
  return jsPdfP||(jsPdfP=new Promise((ok,no)=>{const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/3.0.3/jspdf.umd.min.js';
    sc.onload=()=>window.jspdf?ok(window.jspdf.jsPDF):no(new Error('jsPDF missing'));sc.onerror=()=>{jsPdfP=null;no(new Error('load failed'))};document.head.appendChild(sc)}));
}
function loadAtlas(){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src='sprites.png'})}
function printCards(){
  const p=S.print;
  return MONS.filter(m=>p.scope==='all'||(p.scope==='missing'&&!isGot(m.d))||(p.scope==='gen'&&m.g===p.gen));
}
function printPanel(){
  const p=S.print; if(!p) return '';
  const n=printCards().length, sheets=Math.ceil(n/9);
  return `<section class="printbox"><div class="rhead"><h3>PRINT PLACEHOLDERS</h3><button class="x" data-act="print-close" aria-label="Close">×</button></div>
    <p class="note">Card-sized placeholders (63×88mm, the size of a real card) for every empty pocket, 9 to an A4 sheet. Each one shows the Pokémon, its number, its binder page and pocket, and your rules.</p>
    <div class="tools">
      <div class="seg" role="group" aria-label="Which cards">${[['all','All Pokémon'],['missing','Not caught yet'],['gen','One gen']].map(([v,l])=>`<button data-pscope="${v}" aria-pressed="${p.scope===v}">${l}</button>`).join('')}</div>
      ${p.scope==='gen'?`<select id="pgen" aria-label="Generation">${ROMAN.slice(1).map((r,i)=>`<option value="${i+1}" ${p.gen===i+1?'selected':''}>Gen ${r}</option>`).join('')}</select>`:''}
    </div>
    <p class="num"><b>${n}</b> cards on <b>${sheets}</b> A4 sheet${sheets===1?'':'s'}${p.scope==='all'&&S.cols===3&&S.rows===3?', one sheet per binder page':''}.</p>
    <div class="ractions"><button class="btn go" data-act="print-go" ${p.busy||!n?'disabled':''}>${p.busy?'MAKING PDF…':'MAKE PDF'}</button>
      <span class="note">${esc(p.msg||'Print at 100% or "Actual size" so the cards come out the right size.')}</span></div></section>`;
}
async function makePdf(){
  const p=S.print, cards=printCards(); if(!cards.length) return;
  p.busy=true; p.msg='Getting ready…'; render();
  try{
    const dl=IS_SITE?{save:async({filename,data})=>saveFile(filename,data)}:await window.claude.use('downloads').catch(()=>null);
    if(!dl) throw {code:'unavailable'};
    const [jsPDF,atlas]=await Promise.all([loadJsPdf(),loadAtlas()]);
    const cv=document.createElement('canvas');cv.width=cv.height=96;const cx=cv.getContext('2d');
    const getSprite=c=>{if(!hasSprite(c.d))return null;const i=c.d-1;cx.clearRect(0,0,96,96);cx.drawImage(atlas,(i%32)*96,Math.floor(i/32)*96,96,96,0,0,96,96);return cv.toDataURL('image/png')};
    const data=cards.map(m=>{const w=where(m);return{d:m.d,name:m.n,dex:pad(m.d),gen:'GEN '+ROMAN[m.g],
      types:m.t.map(t=>({name:TYPES[t],color:TYPE_BG[TYPES[t]]})),where:`Binder page ${w.page} · pocket ${w.slot}`}});
    const doc=await buildPlaceholderPdf(jsPDF,data,myRules().map(r=>r.t),getSprite,(pg,n)=>{p.msg=`Making sheet ${pg} of ${n}…`;const el=document.querySelector('.printbox .ractions .note');if(el)el.textContent=p.msg});
    p.msg='Choose where to save it…'; render();
    const name=p.scope==='gen'?`Pokedex placeholders - Gen ${ROMAN[p.gen]}.pdf`:p.scope==='missing'?'Pokedex placeholders - not caught yet.pdf':'Pokedex placeholders.pdf';
    await dl.save({filename:name,data:doc.output('blob')});
    p.msg='Saved. Print at 100% or "Actual size".';
  }catch(e){
    p.msg=e&&e.code==='declined'?'Not saved.':e&&(e.code==='unavailable'||e.code==='not_granted'||e.code==='capability_disabled')?"Saving files isn't available in this view.":"Couldn't make the PDF. Check your connection and try again.";
  }
  p.busy=false; render();
}

function achievements(){

  const setAch=(cat,id,name,desc,icon,dexes)=>{
    const list=dexes.filter(d=>BY.has(d)); if(!list.length) return;
    const got=list.filter(d=>S.caught.has(d));
    out.push({cat,id,name,desc,icon,have:got.length,need:list.length,at:got.length===list.length?Math.max(...got.map(gotAt)):null});
  };
  const countAch=(cat,id,name,desc,icon,have,need,at)=>out.push({cat,id,name,desc,icon,have:Math.min(have,need),need,at:have>=need?at:null});

  // Milestones
  for(const [n,name] of MILESTONES) if(n<MONS.length) countAch('Milestones','m'+n,name,`Catch ${n} Pokémon.`,{num:n},ats.length,n,ats[n-1]);
  setAch('Milestones','all',"Gotta Catch 'Em All",'Every Pokémon in the binder.',{num:'ALL'},MONS.map(m=>m.d));
  setAch('Milestones','bookends','Alpha & Omega','The first and last Pokémon in the dex.',{dex:1},[MONS[0].d,MONS[MONS.length-1].d]);

  // Regions
  for(let g=1;g<=10;g++){
    const ds=MONS.filter(m=>m.g===g).map(m=>m.d); if(!ds.length) continue;
    const got=ds.filter(d=>S.caught.has(d)).map(gotAt).sort((a,b)=>a-b), half=Math.ceil(ds.length/2), ic=REGION_ICON[g]?{dex:REGION_ICON[g]}:{num:'X'};

  return out;
}

const queues=new Map();
function serial(key,fn){const p=(queues.get(key)||Promise.resolve()).then(fn,fn);queues.set(key,p.catch(()=>{}));return p}
async function writeCaught(d,val){
  const m=BY.get(d); const key='g'+m.g;
  if(val) S.caught.set(d,val); else S.caught.delete(d);
  render(); if(openDex) drawDetail();
  if(!S.db) return;
  try{
    await serial(key,async()=>{
      const ref=S.db.doc('binder/'+key);
      if(S.binderDocs.has(key)) await ref.update({[d]:val||null});
      else{const snap=await ref.get(); if(snap.exists) await ref.update({[d]:val||null}); else await ref.set({[d]:val||null}); S.binderDocs.add(key)}
    });
  }catch(e){fail(e)}
}
function fail(e){
  if(e&&e.code==='invalid_argument'){S.canWrite=false;render()}
  toast(e&&e.code==='quota_exceeded'?'Your binder is full. Remove some entries and try again.':'That change didn\'t save. Check your connection and try again.');

async function pickTeam(){

  for(let i=p.length-1;i>0;i--){const j=rand(i+1);[p[i],p[j]]=[p[j],p[i]]}
  const mons=p.slice(0,TEAM_SIZE).map(m=>m.d);
  const n=S.teams.reduce((a,t)=>Math.max(a,t.n),0)+1;
  const team={id:'t'+String(n).padStart(4,'0'),n,at:Date.now(),mons};
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  S.reveal={n,mons,shown:0}; render();
  if(S.db){try{await S.db.doc('teams/'+team.id).set({n,at:team.at,mons})}catch(e){S.reveal=null;render();fail(e);return}}
  if(!S.teams.some(t=>t.id===team.id)) S.teams.push(team);

}

/* ---------- on-device storage, used when the page runs as a website outside Claude ---------- */
const LOCAL_KEY='pb.local.v1', IS_SITE=!window.claude;
function localDb(){
  let store; try{store=JSON.parse(localStorage.getItem(LOCAL_KEY))||{}}catch{store={}}
  const subs={}, copy=v=>JSON.parse(JSON.stringify(v));
  const save=()=>{try{localStorage.setItem(LOCAL_KEY,JSON.stringify(store))}catch{toast("Couldn't save on this device. Private browsing can block saving.")}};
  const snap=col=>{const c=store[col]||{},docs=Object.keys(c).sort().map(id=>({id,exists:true,data:()=>c[id]}));return{docs,size:docs.length,empty:!docs.length}};
  const notify=col=>(subs[col]||[]).forEach(fn=>fn(snap(col)));
  const merge=(a,b)=>{for(const k in b){const v=b[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object')merge(a[k],v);else a[k]=v}return a};
  // another tab changed the data: pick it up
  addEventListener('storage',e=>{if(e.key===LOCAL_KEY){try{store=JSON.parse(e.newValue)||{}}catch{store={}}Object.keys(subs).forEach(notify)}});
  return{
    doc(path){const [col,id]=path.split('/');return{
      async get(){const d=store[col]?.[id];return{id,exists:!!d,data:()=>d}},
      async set(v){(store[col]||(store[col]={}))[id]=copy(v);save();notify(col)},
      async update(v){const c=store[col]||(store[col]={});c[id]=merge(c[id]||{},copy(v));save();notify(col)},
      async delete(){if(store[col]){delete store[col][id];save();notify(col)}}}},
    collection(col){return{onSnapshot(fn){(subs[col]||(subs[col]=[])).push(fn);setTimeout(()=>fn(snap(col)),0);return()=>{}}}},
    backup:()=>JSON.stringify({app:'pokedex-binder',version:1,savedAt:new Date().toISOString(),data:store}),
    restore(obj){store=copy(obj);save();Object.keys(subs).forEach(notify)},
  };
}
function saveFile(name,blob){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

  if(!S.local) return '';
  if(S.restore) return `<div class="confirm"><span>Restore <b>${esc(S.restore.name)}</b>? It replaces everything saved in this browser.</span>

  return `<span class="localnote">Saved in this browser only.</span><button class="link" data-act="backup">Download backup</button>
    <label class="link" for="restorefile">Restore backup</label><input type="file" id="restorefile" accept=".json,application/json" hidden>`;

        if(body.currency){setCurrency(body.currency);ls.set('pb.cur',CUR[0])}
        if(Array.isArray(body.rules)) S.rules=body.rules.filter(id=>ruleOf(id));
        if(body.layout&&body.layout.cols&&body.layout.rows){applyLayout(body.layout.cols,body.layout.rows);ls.set('pb.layout',[S.cols,S.rows])}
        continue}
      for(const [k,v] of Object.entries(body)){
        if(!v) continue;
        if(doc.id==='extras') extras.set(+k,v); else caught.set(+k,v);
      }
    }
    S.caught=caught; S.extras=extras; rebuild(); done('binder');
  },e=>{toast('Lost connection to your binder. Reload to reconnect.')});
  db.collection('teams').onSnapshot(snap=>{
    S.teams=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.n-b.n);
    done('teams');
  },e=>{toast('Lost connection to your binder. Reload to reconnect.')});
})();
</script>
